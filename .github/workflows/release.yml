name: Build and publish RE8Display
on:
  push:
    branches: [ "main" ]
    tags: ['v*']
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Windows x64 plugin
        shell: pwsh
        run: ./tools/RE8Display.Build.ps1 -Generator 'Visual Studio 17 2022'
      - name: Native, ABI and installation checks
        shell: pwsh
        run: ./tools/RE8Display.Test.ps1 -Generator 'Visual Studio 17 2022'
      - name: Create and verify minimal runtime ZIP
        shell: pwsh
        run: |
          ./tools/RE8Display.Package.ps1
          $package = Get-Content artifacts/build/RE8Display-package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$($package.version)") { throw 'Tag differs from the compiled plugin version.' }
          ./tests/RE8Display.Package.Tests.ps1 -PackageRoot $package.directory
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $package.archive -Destination dist/RE8Display-2.7.0.zip
          (Get-FileHash dist/RE8Display-2.7.0.zip -Algorithm SHA256).Hash + '  RE8Display-2.7.0.zip' | Set-Content dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME || gh release create $env:GITHUB_REF_NAME dist/RE8Display-2.7.0.zip dist/SHA256SUMS.txt --verify-tag --prerelease --title "RE8Display $($env:GITHUB_REF_NAME.TrimStart('v')) candidate" --notes-file docs/release-2.7.0.md
